server:
  port: 8090

spring:
  cloud:
    gateway:
      routes:
        - id: api-interface
          uri: http://localhost:8088
          predicates:
            - Path=/api/**
  profiles:
    active: prod
logging:
  level:
    org.springframework.cloud.gateway: DEBUG


dubbo:
  application:
    name: dubbo-springboot-demo-provider
  protocol:
    name: dubbo
    port: -1
  registry:
    id: nacos-registry
    address: nacos://localhost:8848